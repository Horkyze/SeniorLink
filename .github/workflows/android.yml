name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - name: Cache project-local Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build-tools/cargo
            .build-tools/rustup
            .build-tools/native-target
          key: native-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'scripts/build-native.sh') }}
      - name: Build patched native libraries
        run: sh scripts/build-native.sh
      - name: Build and verify
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify APK native packaging
        run: python3 scripts/verify-apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: SeniorLink-pilot-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
